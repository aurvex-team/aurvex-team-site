name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for site checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test storefront
        run: |
          node --check assets/app.js
          node --check assets/id-ui.js
          node --check assets/id-service.js
          node --check assets/friends-service.js
          node --check assets/friends-ui.js
          node --check assets/id-config.js
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp index.html _site/store.html
          cp index.html _site/id.html
          cp index.html _site/profile.html
          cp -r assets _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
