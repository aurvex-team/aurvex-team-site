<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-label="Devive concept: side-on cutaway of a shadowy two-story house interior">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#181824"/><stop offset="1" stop-color="#0a0c15"/></linearGradient>
 <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#51484d"/><stop offset=".6" stop-color="#2c2933"/><stop offset="1" stop-color="#171a23"/></linearGradient>
 <linearGradient id="floor" x2="1" y2="0"><stop stop-color="#342a31"/><stop offset="1" stop-color="#1b1a22"/></linearGradient>
 <radialGradient id="amber"><stop stop-color="#ebb58f" stop-opacity=".53"/><stop offset=".37" stop-color="#ba7e69" stop-opacity=".14"/><stop offset="1" stop-color="#cb8e65" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#8c99bb" stop-opacity=".26"/><stop offset="1" stop-color="#9191a2" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="64" height="28" patternUnits="userSpaceOnUse"><path d="M0 26h64M32 0v27" stroke="#b09b8e" stroke-opacity=".08"/></pattern>
 <filter id="dust"><feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter>
</defs>
<rect width="1440" height="840" fill="url(#bg)"/><circle cx="332" cy="302" r="370" fill="url(#blue)"/>
