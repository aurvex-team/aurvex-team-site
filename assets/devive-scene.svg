<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-label="Illustrated moonlit two-storey house in a foggy forest, concept artwork for Devive">
<defs>
 <linearGradient id="sky" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#151b2e"/><stop offset=".48" stop-color="#26263b"/><stop offset="1" stop-color="#0b111d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#d9d5dd" stop-opacity=".38"/><stop offset=".52" stop-color="#a7a9cb" stop-opacity=".14"/><stop offset="1" stop-color="#9c9aab" stop-opacity="0"/></radialGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242733"/><stop offset="1" stop-color="#0c1119"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c4958"/><stop offset=".55" stop-color="#34343f"/><stop offset="1" stop-color="#171c28"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343443"/><stop offset="1" stop-color="#151923"/></linearGradient>
 <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5b58a"/><stop offset="1" stop-color="#865c65"/></linearGradient>
 <radialGradient id="windowGlow"><stop stop-color="#ea9268" stop-opacity=".26"/><stop offset="1" stop-color="#ea9268" stop-opacity="0"/></radialGradient>
 <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#acb6ce" stop-opacity=".02"/><stop offset="1" stop-color="#c8c4d8" stop-opacity=".16"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".35" numOctaves="3" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter>
 <pattern id="boards" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 28h60M30 0v28" stroke="#88818e" stroke-opacity=".14" stroke-width="1.5"/></pattern>
